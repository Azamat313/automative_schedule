{% extends "base.html" %}

{% block title %}Edit Event{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Event</h2>

    <form method="POST" action="/edit/{{ event.id }}">
        <div class="form-group">
            <label for="title">Event Title *</label>
            <input type="text" id="title" name="title" value="{{ event.title }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ event.description }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" value="{{ event.date }}" required>
            </div>

            <div class="form-group">
                <label for="time">Time *</label>
                <input type="time" id="time" name="time" value="{{ event.time }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{ event.location }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
